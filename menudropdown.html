<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu dropdown</title>
    <style>
        .dropbtn{
            background-color: green;
            color: white;
            padding: 16px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }

        .dropdown{
            position: relative;
            display: inline-block
        }
        .dropdown-conteudo{
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px gray(0,0,0, 0.2); 
            z-index: 1;
        }
        .dropdown-conteudo a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;

        }

        .dropdown-conteudo a:hover{
            background-color: aliceblue;

        }

        .dropdown:hover .dropdown-conteudo{
            display: block;
        }

        .dropdown:hover .dropbtn{
            background-color: #3e8e41;
        }

    </style>
</head>
<body>
    <h2>menu</h2>
    <p>mova o mouse até o botao para abrir o menu dropdown</p>
    <div class="dropdown">
        <button class="dropbtn">dropdown</button>
        <div class="dropdown-conteudo">
            <a href="#">link 1</a>
            <a href="#">link 2</a>
            <a href="#">link 3</a>
        </div>
    </div>
</body>
</html>
